<!DOCTYPE html>

    <!--
      `maximum-scale=1.0` kaldırıldı: parmakla yakınlaştırmayı kapatıyordu
      (WCAG 2.1 · 1.4.4 Metni Yeniden Boyutlandırma). `viewport-fit=cover` ve
      `interactive-widget` çentikli ekran ve klavye davranışı için kalıyor.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- ── Kimlik ──────────────────────────────────────────────────────────
         Başlık ve açıklama yol bazlı olarak `useDocumentMeta` ile değişiyor;
         buradakiler ana sayfanın karşılığı ve JS çalıştırmayan botların
         gördüğü tek sürüm. -->
    <title>Online İngilizce Dersleri · English with Dilara</title>
    <meta name="description" content="Çocuklar ve yetişkinler için online İngilizce dersleri. Oyun ve sohbetle ilerleyen birebir ya da küçük grup dersleri; ücretsiz deneme dersiyle başlayın." />

    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="English with Dilara" />
    <meta name="theme-color" content="#FFF8EF" />

    <!-- ── Bağlantı ısıtma ─────────────────────────────────────────────────
         Supabase'e ilk istek oturum kontrolü için uygulama açılır açılmaz
         gidiyor; TLS el sıkışması JS inerken başlasın. Başlıktaki logo da
         ilk ekranda görünen tek büyük görsel. -->
    <link rel="preconnect" href="https://hwwpbtcgppzuscbvjkde.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://hwwpbtcgppzuscbvjkde.supabase.co" />
    <link rel="preload" as="image" href="/uploads/logo.webp" type="image/webp" fetchpriority="high" />

    <!-- ── Simgeler ────────────────────────────────────────────────────────
         Sekmede logonun yıldızı, zemini şeffaf duruyor: `favicon.svg` her
         ölçekte keskin (1,5 kB) ve açık/koyu sekme çubuğunda aynı okunuyor.
         `.ico` yalnızca SVG'yi desteklemeyen tarayıcılar ve /favicon.ico'yu
         doğrudan isteyen tarayıcı botları için; içinde 16/32/48 kareleri
         saydam PNG olarak duruyor ve 16'lık kare kalın hatlı ayrı bir
         çizim (yazı ve allık o boyutta lekeye dönüşüyordu).
         `sizes="32x32"`, SVG'yi destekleyen tarayıcının SVG'yi seçmesini
         sağlayan işaret. Ana ekran ikonu tam markayı, kuyruğuyla taşır. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ── Ana ekrana eklendiğinde ─────────────────────────────────────── -->
